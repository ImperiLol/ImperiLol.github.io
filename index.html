<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collatz Sandbox</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #222;
            font-family: sans-serif;
        }
        canvas {
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 4px;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="400" height="400"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Emulate CMU Canvas configuration
    const app = {
        NV: 0,
        PS: [],
        stepsPerSecond: 30, // Default CMU speed until changed
        paused: false
    };

    // --- SCENE GROUPS & OBJECTS ---
    const base = { visible: true };
    const sst = { visible: false };
    const ss1 = { visible: false };

    // Base Group Elements
    const WL = { type: 'Label', value: "Welcome to the Collatz Sandbox!", x: 200, y: 50, bold: true, fill: "green", size: 20, align: 'center' };
    const ML = { type: 'Label', value: "Click the Button to Begin!", x: 200, y: 75, bold: true, fill: "blue", size: 15, align: 'center' };
    const B =  { type: 'Rect', x: 100, y: 100, w: 200, h: 200, fill: 'black' };
    const button = { type: 'Circle', cx: 200, cy: 200, r: 75, fill: "red", border: "yellow", borderWidth: 3, visible: true };
    const LW = { type: 'Label', value: "||||", x: 50, y: 200, size: 75, bold: true, fill: 'black', align: 'center' };
    const LE = { type: 'Label', value: "||||", x: 350, y: 200, size: 75, bold: true, fill: 'black', align: 'center' };
    const RW = { type: 'Line', x1: 150, y1: 300, x2: 150, y2: 400, fill: "red", lineWidth: 4 };
    const GW = { type: 'Line', x1: 250, y1: 300, x2: 250, y2: 400, fill: "green", lineWidth: 4 };
    const BW = { type: 'Line', x1: 200, y1: 300, x2: 200, y2: 400, fill: "blue", lineWidth: 4 };
    const Bx = { type: 'Rect', x: 125, y: 300, w: 150, h: 10, fill: "silver" };
    
    // SST Group Elements
    const CN =  { type: 'Label', value: 0, x: 200, y: 75, size: 80, fill: 'black', align: 'center' };
    const CNL = { type: 'Label', value: "Current Number", x: 200, y: 125, size: 25, fill: 'black', align: 'center' };
    const HS =  { type: 'Label', value: 1, x: 200, y: 175, size: 80, fill: "dodgerBlue", align: 'center' };
    const HSL = { type: 'Label', value: "Hailstone Number", x: 200, y: 225, size: 25, fill: "deepSkyBlue", align: 'center' };
    const SN =  { type: 'Label', value: 0, x: 200, y: 275, size: 80, fill: "indigo", align: 'center' };
    const SNL = { type: 'Label', value: "Summit Number", x: 200, y: 325, size: 25, fill: "indigo", align: 'center' };
    const DNA = { type: 'Label', value: "", x: 200, y: 350, size: 12, font: "monospace", fill: 'black', align: 'center' };

    // SS1 Group Elements
    const reset = { type: 'Label', value: "RESET", x: 200, y: 375, fill: "red", size: 25, visible: false, align: 'center' };
    const LN =    { type: 'Label', value: 0, x: 35, y: 25, size: 30, fill: 'black', align: 'left' };
    const CPR =   { type: 'Label', value: "(C)-CollatzSandbox.com LLCI ''Incorpated''", x: 275, y: 10, fill: "darkgray", size: 10, align: 'right' };

    // Compile targets for the custom ApplyPulse loops
    const sstObjects = [CN, HS, HSL, CNL, SN, SNL, DNA];

    // --- GAME FUNCTIONS ---

    function Collatzfunction(n) {
        if (n > 0) {
            if (n % 2 === 0) {
                n = Math.floor(n / 2);
                app.PS.push(0);
            } else {
                n = (n * 3) + 1;
                app.PS.push(1);
            }
            
            CN.value = n;
            if (CN.value > SN.value) {
                SN.value = CN.value;
            }
            DNA.value = app.PS.join("");
            HS.value += 1;
        }
    }

    function ApplyPulse(mg) {
        for (let obj of sstObjects) {
            if (obj.size > 30) {
                obj.x += mg;
            } else if (obj.size < 30) {
                obj.x += (mg / 2);
            }
        }
    }

    // --- EVENT LISTENERS ---

    canvas.addEventListener('mousedown', function(e) {
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        // Button Click Check (Circle detection: distance formula)
        const dist = Math.sqrt((mouseX - button.cx) ** 2 + (mouseY - button.cy) ** 2);
        if (dist <= button.r && button.visible && base.visible) {
            let userInput = prompt("Your Number?");
            if (userInput !== null && userInput.trim() !== "") {
                // Check if it's a valid digit string
                if (/^\d+$/.test(userInput)) {
                    let val = parseInt(userInput, 10);
                    if (val > 0) {
                        app.NV = val;
                        LN.value = app.NV;
                        CN.value = app.NV;
                        SN.value = val;
                        HS.value = 1;
                        app.PS = []; // Clear old sequence
                        
                        base.visible = false;
                        sst.visible = true;
                        ss1.visible = true;
                        reset.visible = true;

                        // Align setup mirroring the python properties
                        LN.x = 10;
                        CPR.x = 390;

                        app.stepsPerSecond = 1; // Slow down step engine for collatz run
                        app.paused = false;
                    }
                }
            }
        }

        // Reset Text Label Click Check (Bounding box approximation)
        if (reset.visible && ss1.visible) {
            // "RESET" is approx 75px wide, 25px high centered at (200, 375)
            if (mouseX >= 160 && mouseX <= 240 && mouseY >= 355 && mouseY <= 390) {
                base.visible = true;
                sst.visible = false;
                ss1.visible = false;
                reset.visible = false;
                app.paused = false;
                HS.value = 1;
                app.NV = 0;
                SN.value = 0;
                DNA.value = "";
                app.stepsPerSecond = 30;
            }
        }
    });

    // --- TIME STEP LOGIC Engine ---
    let lastStepTime = 0;

    function onStep() {
        if (sst.visible === true) {
            if (CN.value > 1) {
                if (HS.value % 2 === 0) {
                    ApplyPulse(-12);
                } else {
                    ApplyPulse(12);
                }
                
                Collatzfunction(CN.value);
                
                if (CN.value % 2 === 0) {
                    CN.fill = "red";
                    CNL.fill = "red";
                } else {
                    CN.fill = "seaGreen";
                    CNL.fill = "seaGreen";
                }
            } else {
                // Reached 1: snap elements back to normal center alignment
                for (let obj of sstObjects) {
                    obj.x = 200;
                }
                CN.fill = "orangeRed";
                CNL.fill = "orangeRed";
            }
        }
    }

    // --- RENDERING CORE ---
    function drawLabel(obj) {
        ctx.fillStyle = obj.fill || 'black';
        ctx.font = `${obj.bold ? 'bold ' : ''}${obj.size || 12}px ${obj.font || 'sans-serif'}`;
        ctx.textAlign = obj.align || 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(obj.value, obj.x, obj.y);
    }

    function draw() {
        // Clear screen canvas container frame
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Render Base Group
        if (base.visible) {
            // Background Square box B
            ctx.fillStyle = B.fill;
            ctx.fillRect(B.x, B.y, B.w, B.h);

            // Lines
            const lines = [RW, GW, BW];
            lines.forEach(l => {
                ctx.strokeStyle = l.fill;
                ctx.lineWidth = l.lineWidth;
                ctx.beginPath();
                ctx.moveTo(l.x1, l.y1);
                ctx.lineTo(l.x2, l.y2);
                ctx.stroke();
            });

            // Base plate box Bx
            ctx.fillStyle = Bx.fill;
            ctx.fillRect(Bx.x, Bx.y, Bx.w, Bx.h);

            // Center Button Circle
            if (button.visible) {
                ctx.beginPath();
                ctx.arc(button.cx, button.cy, button.r, 0, Math.PI * 2);
                ctx.fillStyle = button.fill;
                ctx.fill();
                ctx.strokeStyle = button.border;
                ctx.lineWidth = button.borderWidth;
                ctx.stroke();
            }

            // Labels
            drawLabel(WL);
            drawLabel(ML);
            drawLabel(LW);
            drawLabel(LE);
        }

        // Render SST Sequence group
        if (sst.visible) {
            drawLabel(CN);
            drawLabel(CNL);
            drawLabel(HS);
            drawLabel(HSL);
            drawLabel(SN);
            drawLabel(SNL);
            drawLabel(DNA);
        }

        // Render SS1 Global Overlay panel items
        if (ss1.visible) {
            drawLabel(LN);
            drawLabel(CPR);
            if (reset.visible) {
                drawLabel(reset);
            }
        }
    }

    // Master App Loop Game Loop Setup
    function mainLoop(timestamp) {
        if (!lastStepTime) lastStepTime = timestamp;
        const elapsed = timestamp - lastStepTime;
        const stepInterval = 1000 / app.stepsPerSecond;

        if (elapsed >= stepInterval) {
            if (!app.paused) {
                onStep();
            }

                lastStepTime = timestamp;
                    }
                    draw();

                    requestAnimationFrame(mainLoop);
                    }
                    
                // Initialize application runtime 
                looprequestAnimationFrame(mainLoop);
