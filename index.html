<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Embedded Project</title>
    <style>
        /* This centers the text alignment for the heading */
        h1 {
            text-align: center;
        }

        /* This forces the iframe to act like a block element and centers it */
        iframe {
            display: block;
            margin: 0 auto;
            border: none; /* Optional: removes the default border around the iframe */
        }
    </style>
</head>
<body>

    <h1>Check out my CS Academy Project:</h1>
    
    <!-- Enriched and enlarged dimensions -->
    <iframe width="800" height="850" src="https://academy.cs.cmu.edu/sharing/tealHorse218288/embed"></iframe>

</body>
</html>
