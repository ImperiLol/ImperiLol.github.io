<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Embedded Project</title>
    <style>
        /* Fill the entire browser window and hide scrollbars */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0d0d; /* Matches CMU's dark theme */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container that maintains the project's aspect ratio */
        .game-container {
            position: relative;
            width: 410px;
            height: 460px;
        }

        /* Scale the iframe up dynamically to fit any screen size */
        iframe {
            width: 410px;
            height: 460px;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            /* Dynamically scales the project based on the smaller screen dimension */
            transform: scale(calc(min(100vw / 410, 100vh / 460)));
            transform-origin: center center;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Your exact iframe line, styled to fit the full screen perfectly -->
        <iframe src="https://academy.cs.cmu.edu/sharing/tealHorse218288/embed" allowfullscreen></iframe>
    </div>

</body>
</html>
